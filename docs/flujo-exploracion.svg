<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1900" viewBox="0 0 1700 1900" role="img" aria-labelledby="title desc">
<title id="title">NEXUS 2.0: movimiento y exploración</title><desc id="desc">Flujo desde leer una dirección hasta explorar una celda, incluidos límites del mapa, base, celdas visitadas y tipos de evento.</desc>
<defs><marker id="arrow" markerWidth="14" markerHeight="12" refX="13" refY="6" orient="auto"><path d="M0,0 L14,6 L0,12 z" fill="#8294A8"/></marker></defs>
<rect width="1700" height="1900" fill="#F4F7FB"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#233445}.title{font-size:40px;font-weight:bold;fill:#17324D}.sub{font-size:23px;fill:#536579}.node{fill:#fff;stroke:#2463A6;stroke-width:4}.green{fill:#EAF7F4;stroke:#167D83;stroke-width:4}.red{fill:#FDECEC;stroke:#B64D4D;stroke-width:4}.gold{fill:#FFF4D8;stroke:#C27A13;stroke-width:4}.purple{fill:#F5EAFE;stroke:#8056A3;stroke-width:4}.gray{fill:#EEF1F5;stroke:#8294A8;stroke-width:4}.head{font-size:25px;font-weight:bold;fill:#17324D}.detail{font-size:19px;fill:#536579}.decision{fill:#FFF4D8;stroke:#C27A13;stroke-width:4}.label{font-size:22px;font-weight:bold;fill:#233445}</style>
<text x="70" y="75" class="title">NEXUS 2.0 · Movimiento y exploración</text><text x="72" y="120" class="sub">Resumen del flujo de Simulador.Mover() y Explorar()</text>

<rect x="610" y="145" width="480" height="100" rx="20" class="node"/>
<text x="628" y="184" class="head">Elegir Moverse</text>
<text x="628" y="217" class="detail">leer dirección W / A / S / D</text>
<polygon points="850,290 1090,365 850,440 610,365" class="decision"/><text x="850" y="373" text-anchor="middle" class="label">¿Dirección válida?</text>
<rect x="80" y="315" width="350" height="100" rx="20" class="red"/>
<text x="98" y="354" class="head">No</text>
<text x="98" y="387" class="detail">avisar y volver al menú</text>
<rect x="610" y="520" width="480" height="115" rx="20" class="node"/>
<text x="628" y="559" class="head">Calcular nueva posición</text>
<text x="628" y="592" class="detail">Mapa.Mover comprueba filas y columnas</text>
<polygon points="850,683 1100,760 850,837 600,760" class="decision"/><text x="850" y="768" text-anchor="middle" class="label">¿Dentro del mapa?</text>
<rect x="1250" y="710" width="370" height="100" rx="20" class="red"/>
<text x="1268" y="749" class="head">No</text>
<text x="1268" y="782" class="detail">avisar límite; conservar posición y energía</text>
<rect x="610" y="910" width="480" height="120" rx="20" class="green"/>
<text x="628" y="949" class="head">Movimiento válido</text>
<text x="628" y="982" class="detail">actualizar posición; energía -2</text>
<polygon points="850,1083 1090,1160 850,1237 610,1160" class="decision"/><text x="850" y="1168" text-anchor="middle" class="label">¿La celda es la base?</text>
<rect x="80" y="1110" width="350" height="100" rx="20" class="green"/>
<text x="98" y="1149" class="head">Sí</text>
<text x="98" y="1182" class="detail">zona segura</text>
<polygon points="850,1320 1100,1400 850,1480 600,1400" class="decision"/><text x="850" y="1408" text-anchor="middle" class="label">¿Ya fue visitada?</text>
<rect x="1250" y="1350" width="370" height="100" rx="20" class="gray"/>
<text x="1268" y="1389" class="head">Sí</text>
<text x="1268" y="1422" class="detail">informar: sin novedades</text>
<rect x="610" y="1510" width="480" height="120" rx="20" class="node"/>
<text x="628" y="1549" class="head">Celda nueva</text>
<text x="628" y="1582" class="detail">marcar visitada y revisar su tipo</text>
<rect x="70" y="1710" width="410" height="150" rx="20" class="gold"/>
<text x="88" y="1749" class="head">Recurso</text>
<text x="88" y="1782" class="detail">si es el núcleo: marcar objetivo; si no, generar objeto</text>
<rect x="645" y="1710" width="410" height="150" rx="20" class="purple"/>
<text x="663" y="1749" class="head">Anomalía</text>
<text x="663" y="1782" class="detail">estabilidad -12, energía -5; objetivo y encuentro</text>
<rect x="1220" y="1710" width="410" height="150" rx="20" class="gray"/>
<text x="1238" y="1749" class="head">Vacío</text>
<text x="1238" y="1782" class="detail">resolver evento aleatorio</text>
<polyline points="850,245 850,290" fill="none" stroke="#167D83" stroke-width="5" marker-end="url(#arrow)"/>
<polyline points="610,365 430,365" fill="none" stroke="#B64D4D" stroke-width="5" marker-end="url(#arrow)"/>
<polyline points="850,440 850,520" fill="none" stroke="#167D83" stroke-width="5" marker-end="url(#arrow)"/>
<polyline points="850,635 850,683" fill="none" stroke="#8294A8" stroke-width="5" marker-end="url(#arrow)"/>
<polyline points="1100,760 1250,760" fill="none" stroke="#B64D4D" stroke-width="5" marker-end="url(#arrow)"/>
<polyline points="850,838 850,910" fill="none" stroke="#167D83" stroke-width="5" marker-end="url(#arrow)"/>
<polyline points="850,1030 850,1083" fill="none" stroke="#8294A8" stroke-width="5" marker-end="url(#arrow)"/>
<polyline points="610,1160 430,1160" fill="none" stroke="#167D83" stroke-width="5" marker-end="url(#arrow)"/>
<polyline points="850,1238 850,1320" fill="none" stroke="#8294A8" stroke-width="5" marker-end="url(#arrow)"/>
<polyline points="1100,1400 1250,1400" fill="none" stroke="#8294A8" stroke-width="5" marker-end="url(#arrow)"/>
<polyline points="850,1480 850,1510" fill="none" stroke="#167D83" stroke-width="5" marker-end="url(#arrow)"/>
<polyline points="850,1630 850,1680 275,1680 275,1710" fill="none" stroke="#8294A8" stroke-width="5" marker-end="url(#arrow)"/>
<polyline points="850,1630 850,1680 850,1710" fill="none" stroke="#8294A8" stroke-width="5" marker-end="url(#arrow)"/>
<polyline points="850,1630 850,1680 1425,1680 1425,1710" fill="none" stroke="#8294A8" stroke-width="5" marker-end="url(#arrow)"/>
</svg>
