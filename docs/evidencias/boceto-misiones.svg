<text x="110" y="363" fill="#35d0c6" font-size="17" font-family="Arial" font-weight="700">01</text>
<text x="165" y="363" fill="#eef5fa" font-size="18" font-family="Arial" font-weight="400">Llegar a la zona de anomalía</text>
<text x="850" y="363" fill="#f06b75" font-size="15" font-family="Arial" font-weight="700">Pendiente</text>
