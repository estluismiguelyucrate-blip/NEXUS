<text x="165" y="495" fill="#eef5fa" font-size="18" font-family="Arial" font-weight="400">Superar al guardián</text>
<text x="850" y="495" fill="#f06b75" font-size="15" font-family="Arial" font-weight="700">Pendiente</text>
<rect x="90" y="528" width="1080" height="52" rx="9" fill="#102638" stroke="#17354a" stroke-width="2"/>
