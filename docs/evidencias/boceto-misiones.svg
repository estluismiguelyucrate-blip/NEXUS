<text x="110" y="429" fill="#35d0c6" font-size="17" font-family="Arial" font-weight="700">02</text>
<text x="165" y="429" fill="#eef5fa" font-size="18" font-family="Arial" font-weight="400">Encontrar el núcleo energético</text>
<text x="850" y="429" fill="#f0c66a" font-size="15" font-family="Arial" font-weight="700">Pendiente</text>
