<text x="90" y="185" fill="#35d0c6" font-size="16" font-family="Arial" font-weight="700">EXPEDICIÓN ACTIVA</text>
<text x="90" y="230" fill="#eef5fa" font-size="34" font-family="Arial" font-weight="700">La anomalía perdida</text>
<text x="90" y="270" fill="#a7bdcc" font-size="18" font-family="Arial" font-weight="400">Investiga la zona, recupera el núcleo y regresa al punto de extracción.</text>
