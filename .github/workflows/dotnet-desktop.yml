name: NEXUS Windows Installer

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexus-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-installer:
    name: Build NEXUS installer
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore Windows dependencies
        run: dotnet restore "NEXUS 2.0.csproj" --runtime win-x64

      - name: Publish self-contained app
        run: dotnet publish "NEXUS 2.0.csproj" --configuration Release --runtime win-x64 --self-contained true --no-restore --output publish

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Compile installer
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          iscc.exe /O"artifacts" "installer\NEXUS.iss"

      - name: Upload installer
        uses: actions/upload-artifact@v6
        with:
          name: NEXUS-Setup-v2.0.0
          path: artifacts/NEXUS-Setup-v2.0.0.exe
          if-no-files-found: error
          retention-days: 14
